# Lumen OS - Hyprland 0.53 (Ubuntu 26.04 LTS)
# Foco: Leveza, Dev-first e Efeito Curved Glass nativo na GPU

$mod = SUPER
$term = kitty
$shell_dir = /usr/share/lumen-os

monitor = ,preferred,auto,1

# Autostart do Curved Glass Shell (Wayland Layer-Shell)
exec-once = /usr/bin/lumen-shell

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(ffffff55) rgba(8da2ff44) 45deg
    col.inactive_border = rgba(ffffff18)
    layout = dwindle
}

decoration {
    rounding = 16
    active_opacity = 0.96
    inactive_opacity = 0.92

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = false
    }

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(00000066)
    }
}

animations {
    enabled = true
    bezier = glassCurve, 0.22, 1.0, 0.36, 1.0
    animation = windows, 1, 5, glassCurve, popin 92%
    animation = fade, 1, 4, default
    animation = workspaces, 1, 5, glassCurve, slide
}

# Hyprland 0.53+ layerrule para aplicar blur real atras da barra GTK4 transparente
layerrule = blur on, match:namespace curved-shell
layerrule = ignore_alpha 0.25, match:namespace curved-shell

# Atalhos essenciais para programação
bind = $mod, Return, exec, $term
bind = $mod, Q, killactive,
bind = $mod, F, togglefloating,
bind = $mod, M, fullscreen, 1
bind = $mod, B, exec, /usr/bin/lumen-shell --orientation horizontal
bind = $mod SHIFT, B, exec, /usr/bin/lumen-shell --orientation vertical

# Navegação entre janelas (vim-like + setas)
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Workspaces 1-5
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
