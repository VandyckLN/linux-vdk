# Lumen OS - Alternativa Wayfire 0.10 (Ubuntu 26.04 LTS)
# Para quem prefere janelas flutuantes tradicionais com efeito blur

[core]
plugins = alpha animate autostart blur command decoration move resize place wobbly window-rules
vswitch = true

[autostart]
shell = /usr/bin/lumen-shell

[blur]
method = kawase
kawase_iterations = 3
kawase_offset = 4.0

[decoration]
active_color = \#242833d8
inactive_color = \#1a1d24b0
border_size = 2
title_height = 28

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = kitty
binding_close = <super> KEY_Q
