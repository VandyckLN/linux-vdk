#
# Post-Installation cleanup hook executing inside target chroot
---
dontChroot: false
timeout: 120
verbose: true

i18n:
    name: "Cleaning up installation temporary files..."

script:
    - "-rm -f /etc/apt/sources.list.d/cdrom.sources"
    - "-rm -f /home/${USER}/Desktop/install-lumen.desktop"
    - "-rm -f /home/${USER}/Desktop/calamares.desktop"
    - "-rm -f /usr/share/applications/install-lumen.desktop"
    - "-rm -rf /var/log/calamares*"
