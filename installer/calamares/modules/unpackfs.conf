# Unpack filesystem configuration for Lumen OS (Casper / Live)
---
unpack:
    -   source: "/cdrom/casper/filesystem.squashfs"
        sourcefs: "squashfs"
        destination: ""
        optional: true
        weight: 10
    -   source: "/run/live/medium/live/filesystem.squashfs"
        sourcefs: "squashfs"
        destination: ""
        optional: true
        weight: 10
