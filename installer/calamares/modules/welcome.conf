# Welcome module configuration for Lumen OS
---
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
showDonateUrl:          false

requirements:
    # Storage requirement in GiB
    requiredStorage:    25.0

    # RAM requirement in GiB
    requiredRam:        4.0

    # Connectivity check URLs (probed if internet check enabled)
    internetCheckUrl:
        - http://connectivity-check.ubuntu.com
        - http://example.com

    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen

    # Mandatory checks: storage, RAM, and root privileges are enforced; internet is optional
    required:
        - storage
        - ram
        - root

geoip:
    style: "none"
