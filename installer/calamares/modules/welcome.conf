# Welcome module configuration for Lumen OS
---
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
showDonateUrl:          false

requirements:
    # Requisito de armazenamento em GiB
    requiredStorage:    25.0

    # Requisito de RAM em GiB
    requiredRam:        4.0

    # URLs de verificação de conectividade (testadas se a verificação de internet estiver ativa)
    internetCheckUrl:
        - http://connectivity-check.ubuntu.com
        - http://example.com

    check:
        - storage
        - ram
        - power
        - internet
        - root
        - screen

    # Verificações obrigatórias: armazenamento, RAM e privilégios de root são exigidos; internet é opcional
    required:
        - storage
        - ram
        - root

geoip:
    style: "none"
