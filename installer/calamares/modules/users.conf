#
# User account configuration for Lumen OS
---
defaultGroups:
    - sudo
    - adm
    - cdrom
    - dip
    - plugdev
    - audio
    - video
    - render
    - netdev
    - name: docker
      must_exist: false
      system: true

sudoersGroup: sudo
sudoersConfigureWithGroup: false
setRootPassword: false
doReusePassword: false
doAutologin: false

passwordRequirements:
    minLength: 6
    maxLength: -1
allowWeakPasswords: false
allowWeakPasswordsDefault: false

user:
    shell: /bin/bash
    home_permissions: "o700"
    forbidden_names:
        - root
        - daemon
        - bin
        - sys
        - sync
        - games
        - man
        - lp
        - mail
        - news
        - uucp
        - proxy
        - www-data
        - backup
        - list
        - irc
        - apt
        - nobody
        - systemd-network
        - systemd-timesync
        - messagebus
        - syslog
        - polkitd
        - lumen

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "${first}-lumen"
    forbidden_names: [ localhost ]

allowActiveDirectory: false
