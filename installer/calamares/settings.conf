#
# Master Configuration for Lumen OS Calamares Installer
# Target: Ubuntu 26.04 LTS (Resolute Raccoon) x86_64
---
modules-search: [ local ]

instances:
  - id: postinstall
    module: shellprocess
    config: shellprocess-postinstall.conf
    weight: 10
  - id: cleanup
    module: shellprocess
    config: shellprocess-cleanup.conf
    weight: 2

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - shellprocess@postinstall
      - grubcfg
      - bootloader
      - shellprocess@cleanup
      - umount
  - show:
      - finished

branding: lumen
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
