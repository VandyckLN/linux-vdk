# Lumen OS - tmux leve e produtivo
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -sg escape-time 10
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Prefixo Ctrl+a mais ergonômico (mantendo Ctrl+b opcional)
set -g prefix C-a
bind C-a send-prefix

# Split intuitivo
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Barra discreta combinando com o vidro escuro
set -g status-position bottom
set -g status-style "bg=#181c24,fg=#d5dce8"
set -g status-left "#[fg=#82aaff,bold] ✦ #S #[default]"
set -g status-right "#[fg=#8d96ab] %H:%M "
