# Lumen OS - Kitty Terminal (Curved Glass Aesthetic)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        11.0

background            #14171f
foreground            #eef2f8
background_opacity    0.78
background_blur       24

window_padding_width  14
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell     no

cursor                #9aaeff
cursor_shape          beam
selection_background  #333d57
selection_foreground  #ffffff

