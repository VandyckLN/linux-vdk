# Lumen OS - Otimizações de Kernel para Desenvolvimento (Ubuntu 26.04 LTS)

# Evita erro ENOSPC em file watchers (Vite, Next.js, Rust-Analyzer, IDEs)
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
fs.inotify.max_user_queued_events = 32768

# Limite alto de descritores para builds paralelos e containers
fs.file-max = 2097152

# Prioriza manter código/cache em RAM antes de usar swap (ideal com zram)
vm.swappiness = 10
vm.vfs_cache_pressure = 50
